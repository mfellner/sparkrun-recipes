        transport; the legacy package name does not identify the inference engine.
        OCI title/version and bundled source identify Drama 3.
      - Single node only; native Triton block-FP8 experts, BF16 dense and GPU codec.
        Not generic vLLM serving.
      - Unauthenticated trusted-LAN personal evaluation. Explicit RFC1918 IPv4 binding
        required; no URL/path media inputs.
      - Requests serialize on one GPU; at most two queued. No general naturalness/speaker/emotion
        accuracy claim.
      - Checkpoint includes codec.pth; no S2 full download required. Weights are never
        baked into the public image.
      - Requests without an explicit legal reference use the disclosed public-domain
        LJ Speech LJ001-0001 voice; unconditioned synthesis is not qualified.
      - Stop/start via SparkRun. Container is retained, but SparkRun's sleep supervisor
        does not respawn a crashed serve process.
