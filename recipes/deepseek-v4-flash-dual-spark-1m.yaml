# Adapted from MiaAI-Lab/DeepSeek-V4-Flash-Dual-DGX-Spark-1M-Context.
# SparkRun provides lifecycle, Ray multi-node coordination, model/image
# distribution, and InfiniBand detection. Model and memory tuning follows the
# upstream MiaAI-Lab deployment, adapted to SparkRun's compatible vllm-node.
recipe_version: "2"
name: deepseek-v4-flash-dual-spark-1m
model: deepseek-ai/DeepSeek-V4-Flash
model_revision: 60d8d70770c6776ff598c94bb586a859a38244f1
runtime: vllm-ray
min_nodes: 2
max_nodes: 2
container: vllm-node

metadata:
  description: DeepSeek V4 Flash on two DGX Sparks with 1M context, FP8 KV cache, MTP, and SparkRun Ray execution
  source: https://github.com/MiaAI-Lab/DeepSeek-V4-Flash-Dual-DGX-Spark-1M-Context
  source_revision: ffa38f9e1bea5c06a6195fca9bff17c04f4785da
  hardware: 2x NVIDIA DGX Spark or compatible GB10 systems
  context_length: 1000000
  model_dtype: fp8
  kv_dtype: fp8
  num_layers: 43
  num_kv_heads: 1
  head_dim: 512

mods: []

# Pin the exact checkpoint and remote model code fetched from Hugging Face.
distribution_config:
  models:
    enabled: true
    entries:
      - name: deepseek-ai/DeepSeek-V4-Flash
        revision: 60d8d70770c6776ff598c94bb586a859a38244f1
        target: [-1]

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  gpu_memory_utilization: 0.83
  max_model_len: 1000000
  block_size: 256
  max_num_seqs: 6
  max_num_batched_tokens: 8192
  speculative_config: '{"method":"mtp","num_speculative_tokens":2}'
  reasoning_config: '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}'
  generation_config: '{"temperature":0.6,"top_p":0.95}'

env:
  DG_JIT_USE_NVRTC: "0"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_B12X_MOE: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_MERGE_NICS: "1"
  NCCL_IB_SUBNET_AWARE_ROUTING: "1"
  NCCL_NET_PLUGIN: none
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: INFO

command: |
  vllm serve /cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash/snapshots/60d8d70770c6776ff598c94bb586a859a38244f1 \
    --served-model-name {model} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --kv-cache-dtype fp8 \
    --block-size {block_size} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --speculative-config '{speculative_config}' \
    --tokenizer-mode deepseek_v4 \
    --distributed-executor-backend ray \
    --tool-call-parser deepseek_v4 \
    --enable-auto-tool-choice \
    --reasoning-parser deepseek_v4 \
    --reasoning-config '{reasoning_config}' \
    --override-generation-config '{generation_config}' \
    --default-chat-template-kwargs.thinking=true \
    --default-chat-template-kwargs.reasoning_effort=high \
    --enable-flashinfer-autotune \
    --load-format instanttensor
