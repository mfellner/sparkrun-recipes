# Adapted from MiaAI-Lab/DeepSeek-V4-Flash-Dual-DGX-Spark-1M-Context.
# SparkRun provides lifecycle, native multi-node coordination, model/image
# distribution, and InfiniBand detection; the model/container/tuning choices
# below follow the upstream MiaAI-Lab deployment.
recipe_version: "2"
name: deepseek-v4-flash-dual-spark-1m
model: deepseek-ai/DeepSeek-V4-Flash
runtime: vllm-distributed
min_nodes: 2
max_nodes: 2
container: aidendle94/sparkrun-vllm-ds4-gb10:production-ready

metadata:
  description: DeepSeek V4 Flash on two DGX Sparks with 1M context, FP8 KV cache, MTP, and native vLLM multi-node execution
  source: https://github.com/MiaAI-Lab/DeepSeek-V4-Flash-Dual-DGX-Spark-1M-Context
  hardware: 2x NVIDIA DGX Spark or compatible GB10 systems
  context_length: 1000000
  model_dtype: fp8
  kv_dtype: fp8
  num_layers: 43
  num_kv_heads: 1
  head_dim: 512

mods: []

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  gpu_memory_utilization: 0.83
  max_model_len: 1000000
  block_size: 256
  max_num_seqs: 6
  max_num_batched_tokens: 8192
  speculative_config: '{"method":"mtp","num_speculative_tokens":2}'
  reasoning_config: '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}'
  generation_config: '{"temperature":0.6,"top_p":0.95}'

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_MERGE_NICS: "1"
  NCCL_IB_SUBNET_AWARE_ROUTING: "1"
  NCCL_NET_PLUGIN: none
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: INFO

command: |
  /usr/local/bin/dsv4-vllm-entrypoint serve {model} \
    --served-model-name {model} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --kv-cache-dtype fp8 \
    --block-size {block_size} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --speculative-config '{speculative_config}' \
    --tokenizer-mode deepseek_v4 \
    --distributed-executor-backend mp \
    --tool-call-parser deepseek_v4 \
    --enable-auto-tool-choice \
    --reasoning-parser deepseek_v4 \
    --reasoning-config '{reasoning_config}' \
    --override-generation-config '{generation_config}' \
    --default-chat-template-kwargs.thinking=true \
    --default-chat-template-kwargs.reasoning_effort=high \
    --enable-flashinfer-autotune
