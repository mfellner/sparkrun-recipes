recipe_version: "2"
name: fish-audio-drama3-dgx-spark
model: fishaudio/drama-3
model_revision: dd64a85cd82e9521f7202610ede97b367fc83946
# vllm is ONLY the solo Docker/lifecycle shim; native Fish performs inference.
runtime: vllm
runtime_version: drama3-gb10-1
max_nodes: 1
container: ghcr.io/mfellner/glm-5.3-flash-2x-dgx-sparks@sha256:5da66fdde5e5efaa54abfc9b4c8bcf8517960d4a7b69b87b32e93e2b1440bdaa
builder: docker-pull
metadata:
  description: Native Fish Audio Drama 3 FP8 experts/BF16 dense on one GB10, personal evaluation
  maintainer: mfellner
  source: https://github.com/fishaudio/fish-speech
  source_revision: 1ff3c3ed2f80d3106a83909dd25b83129c3d816f
  hardware: NVIDIA GB10 SM121
  model_dtype: bfloat16
  notes:
    - Built with Fish Audio. Fish Audio Community License v1.0; review hosted-service and voice-consent restrictions.
    - The public image reuses this repo's existing public GHCR package as an artifact transport; the legacy package name does not identify the inference engine. OCI title/version and bundled source identify Drama 3.
    - Single node only; native Triton block-FP8 experts, BF16 dense and GPU codec. Not generic vLLM serving.
    - Unauthenticated trusted-LAN personal evaluation. Explicit RFC1918 IPv4 binding required; no URL/path media inputs.
    - Requests serialize on one GPU; at most two queued. No general naturalness/speaker/emotion accuracy claim.
    - Checkpoint includes codec.pth; no S2 full download required. Weights are never baked into the public image.
    - Requests without an explicit legal reference use the disclosed public-domain LJ Speech LJ001-0001 voice; unconditioned synthesis is not qualified.
    - Stop/start via SparkRun. Container is retained, but SparkRun's sleep supervisor does not respawn a crashed serve process.
distribution_config:
  models:
    enabled: true
    entries:
      - name: fishaudio/drama-3
        revision: dd64a85cd82e9521f7202610ede97b367fc83946
        target: [-1]
executor_config:
  entrypoint: ""
  auto_remove: false
  privileged: false
  user: "1000:1000"
  network: host
  ipc: private
  shm_size: 2gb
  cap_add: []
  devices: []
  security_opt: [no-new-privileges]
env:
  HF_HOME: /cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FISH_DRAMA3_FP8_EXPERTS: "1"
  FISH_DRAMA3_CUDA_GRAPH: "1"
  TRITON_PTXAS_PATH: /usr/local/cuda/bin/ptxas
  TRITON_CACHE_DIR: /cache/huggingface/drama3/triton
  CUDA_CACHE_PATH: /cache/huggingface/drama3/cuda
  DRAMA_MODEL_DIR: /cache/huggingface/hub/models--fishaudio--drama-3/snapshots/dd64a85cd82e9521f7202610ede97b367fc83946
  DRAMA_OUTPUT_DIR: /cache/huggingface/drama3/outputs
  OMP_NUM_THREADS: "4"
defaults:
  port: 8010
  host: 192.168.178.70
  tensor_parallel: 1
  served_model_name: fishaudio/drama-3
command: |
  exec env DRAMA_BIND_IP={host} DRAMA_PORT={port} /opt/drama/run.sh
