recipe_version: "2"

name: GLM-5.2 Vision NVFP4+AQLM Triple DGX Spark FP8 KV 235K

description: >-
  SparkRun adaptation of MiaAI-Lab/GLM-5.2-NVFP4-AQLM-Triple-DGX-Sparks:
  Path B (coding speed) for GLM-5.2 Vision with hybrid NVFP4+AQLM weights,
  FP8 MLA KV cache, 235,392-token context, MTP-3 speculative decoding,
  and Ray tensor parallelism across exactly three DGX Spark or compatible
  GB10 nodes.

model: jarrelscy/GLM-5.2-NVFP4-AQLM-hybrid
# Immutable vision-wrapper revision retained by latest upstream commit 5c85163.
model_revision: 53e0082eedebd806b63e19779c47905937d768ca

runtime: vllm-ray
runtime_version: k12l1-vision
mode: cluster
cluster_only: true
min_nodes: 3
max_nodes: 3

# Pin the upstream k12l1-vision image by immutable manifest digest.
container: ghcr.io/miaai-lab/glm-5.2-nvfp4-triple-dgx-sparks@sha256:f8f350d46b33858eda4f0c0a5c39a7f0b27005111d393098baaaacae18c10fdb

executor_config:
  # Clear the image's manual-launch entrypoint so SparkRun owns Ray/container lifecycle.
  entrypoint: ""
  privileged: true
  gpus: all
  ipc: host
  shm_size: 10gb
  network: host
  cap_add:
    - IPC_LOCK
  ulimit:
    - memlock=-1
    - stack=67108864
  devices:
    - /dev/infiniband:/dev/infiniband

# Download the exact multimodal wrapper/checkpoint snapshot to every node.
distribution_config:
  models:
    enabled: true
    entries:
      - name: jarrelscy/GLM-5.2-NVFP4-AQLM-hybrid
        revision: 53e0082eedebd806b63e19779c47905937d768ca
        target: [-1]
  containers:
    enabled: true
    entries:
      - name: ghcr.io/miaai-lab/glm-5.2-nvfp4-triple-dgx-sparks@sha256:f8f350d46b33858eda4f0c0a5c39a7f0b27005111d393098baaaacae18c10fdb
        target: [-1]

# Commands run inside every node container after Ray starts and before vLLM starts.
pre_exec:
  - >-
    mkdir -p
    /cache/huggingface/sparkrun-runtime-cache/glm52-fp8/torchinductor
    /cache/huggingface/sparkrun-runtime-cache/glm52-fp8/vllm
    /cache/huggingface/sparkrun-runtime-cache/glm52-fp8/flashinfer
    /cache/huggingface/sparkrun-runtime-cache/glm52-fp8/nccl-2.30.7
  - |-
    set -euo pipefail
    nccl_dir=/cache/huggingface/sparkrun-runtime-cache/glm52-fp8/nccl-2.30.7
    nccl_lib="$nccl_dir/libnccl.so.2"
    wheel="$nccl_dir/nvidia_nccl_cu13-2.30.7-aarch64.whl"
    extract="$nccl_dir/extract"
    url='https://files.pythonhosted.org/packages/d1/21/a73174c6157101bdf1ffc22b517f76ff0082613989dd9bc8f43e8034caac/nvidia_nccl_cu13-2.30.7-py3-none-manylinux_2_18_aarch64.whl'
    wheel_sha='ca786ffa5a647c75d4d1f5cc72a6c4f537947e2ba8823d7c8aaf768e7a7b9f77'
    lib_sha='fc7ea66334edbc934aa25959b9907dbb2b91a1d2485beff18839afc45cbc08d0'
    if ! printf '%s  %s\n' "$lib_sha" "$nccl_lib" | sha256sum -c - >/dev/null 2>&1; then
      rm -f "$nccl_lib"
      curl -fL --retry 3 "$url" -o "$wheel"
      printf '%s  %s\n' "$wheel_sha" "$wheel" | sha256sum -c -
      rm -rf "$extract"
      /opt/vllm/.venv/bin/python -m zipfile -e "$wheel" "$extract"
      install -m 0755 "$extract/nvidia/nccl/lib/libnccl.so.2" "$nccl_lib"
      rm -rf "$extract" "$wheel"
    fi
    printf '%s  %s\n' "$lib_sha" "$nccl_lib" | sha256sum -c -
  - >-
    chown -R --reference=/cache/huggingface
    /cache/huggingface/sparkrun-runtime-cache/glm52-fp8

# Effective environment combines upstream settings, SparkRun transport translation,
# and the validated three-node CX-7 triangle tuning below.
env:
  PATH: /opt/vllm/.venv/bin:/root/.cargo/bin:/workspace/vllm:/usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  VIRTUAL_ENV: /opt/vllm/.venv
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

  RAY_memory_usage_threshold: "0.99"
  RAY_memory_monitor_refresh_ms: "0"
  # Preserve upstream's 128 MiB object store without requiring SparkRun launcher changes.
  RAY_DEFAULT_OBJECT_STORE_MEMORY_PROPORTION: "0.0009765625"
  RAY_DEFAULT_OBJECT_STORE_MAX_MEMORY_BYTES: "134217728"

  CUDA_DEVICE_ORDER: PCI_BUS_ID
  CUDA_DEVICE_MAX_CONNECTIONS: "32"
  CUTE_DSL_ARCH: sm_121a
  TORCH_CUDA_ARCH_LIST: 12.1a
  OMP_NUM_THREADS: "16"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  SAFETENSORS_FAST_GPU: "1"

  NCCL_P2P_DISABLE: "1"
  NCCL_SHM_DISABLE: "1"
  NCCL_MAX_NCHANNELS: "4"
  NCCL_MIN_NCHANNELS: "4"
  NCCL_BUFFSIZE: "1048576"
  NCCL_PROTO: LL,LL128,Simple
  NCCL_CROSS_NIC: "1"
  # Preserve upstream's two-HCA selection. The physical triangle must cross
  # port 0/f0 to port 1/f1 on every cable so each rank can reach both peers.
  NCCL_IB_HCA: rocep1s0f0,rocep1s0f1
  NCCL_IB_MERGE_NICS: "0"
  NCCL_IB_SUBNET_AWARE_ROUTING: "1"
  NCCL_GIN_ENABLE: "0"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  # Bootstrap over the common LAN; model traffic uses the selected RoCE HCAs.
  NCCL_SOCKET_IFNAME: enP7s7
  NCCL_DEBUG: WARN
  NCCL_GRAPH_MIXING_SUPPORT: "1"

  FLASHINFER_MLA_SPARSE_SM120: "1"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  VLLM_DISABLE_FLASHINFER_AUTOTUNE: "1"
  VLLM_DISABLE_FP8_W8A16: "0"
  VLLM_MTP_INDEX_SHARE: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "192"

  GLM_SHARED_EXPERTS_DEBUG: "1"
  GLM_MOE_LANE_ROWS: "1"
  GLM_NVFP4_LUT256: "1"
  GLM_MOE_AQLM_CB: l1
  GLM_MOE_AQLM_STREAM: "1"
  GLM_NVFP4_STREAM: "1"
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

  VLLM_WORKER_MULTIPROC_METHOD: spawn
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  VLLM_NCCL_SO_PATH: /cache/huggingface/sparkrun-runtime-cache/glm52-fp8/nccl-2.30.7/libnccl.so.2

  TORCHINDUCTOR_CACHE_DIR: /cache/huggingface/sparkrun-runtime-cache/glm52-fp8/torchinductor
  VLLM_CACHE_ROOT: /cache/huggingface/sparkrun-runtime-cache/glm52-fp8/vllm
  FLASHINFER_WORKSPACE_DIR: /cache/huggingface/sparkrun-runtime-cache/glm52-fp8/flashinfer

# The snapshot path avoids an online HF lookup and guarantees the pinned wrapper revision.
defaults:
  tensor_parallel: 3
  pipeline_parallel: 1
  data_parallel: 1
  served_model_name: glm-5.2
  port: 8000
  max_model_len: 235392
  max_num_seqs: 1
  max_num_batched_tokens: 4096

command: >-
  vllm serve
  /cache/huggingface/hub/models--jarrelscy--GLM-5.2-NVFP4-AQLM-hybrid/snapshots/53e0082eedebd806b63e19779c47905937d768ca
  --served-model-name {served_model_name}
  --host 0.0.0.0
  --port {port}
  --trust-remote-code
  --distributed-executor-backend ray
  --tensor-parallel-size {tensor_parallel}
  --pipeline-parallel-size {pipeline_parallel}
  --decode-context-parallel-size 1
  --dcp-comm-backend ag_rs
  --kv-cache-dtype fp8_ds_mla
  --gpu-memory-utilization 0.9
  --max-model-len {max_model_len}
  --max-num-seqs {max_num_seqs}
  --max-num-batched-tokens {max_num_batched_tokens}
  --no-enable-flashinfer-autotune
  --compilation-config '{"mode":3,"cudagraph_mode":"FULL","cudagraph_capture_sizes":[4,8,12,16,20,24],"pass_config":{"fuse_allreduce_rms":true,"fuse_norm_quant":true}}'
  --enable-auto-tool-choice
  --tool-call-parser glm47
  --reasoning-parser glm45
  --default-chat-template-kwargs '{"enable_thinking":false}'
  --speculative-config '{"method":"deepseek_mtp","num_speculative_tokens":3}'
  --async-scheduling
  --hf-overrides '{"num_experts_per_tok":4,"index_topk_freq":8}'
  --kv-cache-memory-bytes 12884901888
  --mm-encoder-tp-mode data

metadata:
  maintainer: mfellner
  source: https://github.com/MiaAI-Lab/GLM-5.2-NVFP4-AQLM-Triple-DGX-Sparks
  source_revision: 5c85163ccb8d98d395880e71e2dbd03976a3f4ad
  architecture: Glm5vForConditionalGeneration
  model_params: 744B
  model_dtype: nvfp4
  # Actual indexed checkpoint payload is 292,491,816,312 bytes (~272.38 GiB).
  model_vram: 272.38
  kv_dtype: fp8
  kv_vram_per_token: 0.0001529363784665579
  max_model_len: 235392
  tensor_parallel: 3
  pipeline_parallel: 1
  multimodal: true
  vision: MoonViT-3d
  notes:
    - Exactly three GB10 GPUs are required; host order defines Ray head then workers.
    - The RoCE and bootstrap interface names match the validated ASUS Ascent GX10 fleet; compatible systems with different interface names must adapt them before launch.
    - Path B uses a 12 GiB FP8 MLA KV allocation, yielding an approximately 240,640-token pool for the 235,392-token served window.
    - FP8 KV improves decode speed but may reduce accuracy relative to Path A's NVFP4 KV; validate application quality before switching production traffic.
    - mm-encoder-tp-mode=data is mandatory because the 16-head MoonViT encoder is not divisible by TP3.
    - Default chat-template thinking is disabled for coding speed; clients can opt in per request.
    - Temporarily stop earlyoom on every node before launch because it can kill Ray workers during graph capture; restore it only after unloading the model and confirming RAM/swap headroom.
    - The runtime is privileged, host-networked, executes pinned remote model code, and exposes unauthenticated inference plus Ray/NCCL ports; every node must remain on a trusted, firewalled private network.
